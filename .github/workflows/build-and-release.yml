name: Build & Release Spring Boot App

on:
  push:
    branches: [ UAT ]  # 👈 Adjust if needed

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build with Maven
        run: mvn clean package -DskipTests

      - name: 📦 Create .zip and .tar.gz archives
        run: |
          mkdir -p artifacts
          cp target/*.jar artifacts/
          cd artifacts
          zip CharityConnect.zip *.jar
          tar -czvf CharityConnect.tar.gz *.jar
          cd ..

      - name: 🔖 Auto-increment version and create a new Git tag
        id: create_new_tag
        run: |
          git fetch --tags

          # Fetch the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Remove the 'v' prefix
          TAG_NO_V=${LATEST_TAG#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NO_V"

          # Increment PATCH version
          NEW_PATCH=$((PATCH + 1))

          # Form new tag
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: 🚀 Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          name: CharityConnect Release ${{ env.NEW_TAG }}
          tag_name: ${{ env.NEW_TAG }}
          files: |
            target/*.jar
            artifacts/CharityConnect.zip
            artifacts/CharityConnect.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
