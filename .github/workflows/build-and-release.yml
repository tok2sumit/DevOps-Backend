name: Build & Release Spring Boot App

on:
  push:
    branches: [ UAT ]  # 👈 adjust to your actual branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build with Maven
        run: mvn clean package -DskipTests

      - name: 🏷️ Get Maven project version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🚀 Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v1
        with:
          name: CharityConnect Release ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: target/CharityConnect-${{ env.VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
