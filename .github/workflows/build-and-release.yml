name: Build & Release Spring Boot App

on:
  push:
    branches: [ UAT ]

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗️ Build with Maven
        run: mvn clean package -DskipTests

      - name: 🔖 Fetch latest tag and auto-increment
        id: create_new_tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tag found. Starting at v1.0.0"
            LATEST_TAG="v1.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"
          TAG_NO_V=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NO_V"
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: 🚀 Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v1
        with:
          name: CharityConnect Release ${{ env.NEW_TAG }}
          tag_name: ${{ env.NEW_TAG }}
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
